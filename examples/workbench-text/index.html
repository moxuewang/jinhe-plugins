<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>文本接力</title>
<style>

</style></head><body><main>
<header><h1>文本接力</h1><button id="help" class="help" aria-label="读取与流转说明"><span aria-hidden="true">？</span></button></header>
<p id="status" role="status" aria-live="polite">选择材料，或直接编辑文本。</p>
<section class="card"><label for="text">文本</label><textarea id="text" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea><div class="actions"><button id="pick">从工作台</button><button id="put" class="primary">送到工作台</button><button id="targets" disabled>发送给工具</button></div><div class="actions"><button id="stop" hidden>取消读取</button></div></section>
</main><dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheetHead"><h2 id="sheetTitle"></h2><button id="close">取消</button></div><p id="sheetError" class="error" role="alert" hidden></p><div id="sheetBody"></div></dialog>
<script>
(function (root, factory) {
    'use strict';
    var api = factory();
    if (typeof module === 'object' && module.exports) module.exports = api;
    else root.WorkbenchTemplate = api;
}(typeof window === 'object' ? window : this, function () {
    'use strict';
    var MAX_BYTES = 32 * 1024 * 1024, MAX_INPUTS = 16;
    function error(message) { throw new Error(message); }
    function utf8Size(text, max) {
        if (typeof text !== 'string') error('没有读到完整文本。');
        var bytes = 0, i, c, next;
        for (i = 0; i < text.length; i += 1) {
            c = text.charCodeAt(i);
            if (c < 128) bytes += 1;
            else if (c < 2048) bytes += 2;
            else if (c >= 55296 && c <= 56319) {

            if (bytes > max) error('文本合计超过 32 MiB；没有截断，当前输入仍保留。');

    }
    function validIds(ids) {

            id = ids[i];
            if (typeof id !== 'string' || !id || Object.prototype.hasOwnProperty.call(seen, '$' + id)) error('材料 ID 无效或重复，请重新选择。');

    function create(jh, view) {
        var epoch = 0, alive = true, busy = false, off = null, selected = [], available = [], candidate = null, saved = null, offered = [], listing = 0;

                }

        }
        function read(ids) {
            var n = start(), texts = [], names = [], used = Math.max(0, ids.length - 1) * 2;
            setBusy(true); view.hide(); view.status('正在读取所选材料…', false);
            return request(function () { check(n); ids = validIds(ids); return jh.workbench.list(); }).then(function (items) {
                check(n); var chosen = metadata(items, ids), chain = Promise.resolve();
                chosen.forEach(function (item) {
                    chain = chain.then(function () { check(n); return jh.workbench.take(item.id); }).then(function (got) {
                        check(n);

                    }).then(function (text) { check(n); used += utf8Size(text, MAX_BYTES - used); texts.push(text); names.push(item.name || '未命名材料'); });
                });

                check(n); candidate = {text:texts.join('\n\n'), bytes:used, names:names}; setBusy(false); view.preview(candidate);

        function pick() {
            if (busy || !alive) return;
            var n = start(), ticket = ++listing; selected = []; available = []; view.pick([], []);

            catch (e) { fail(n, e); return; }
            request(function () { check(n); return jh.workbench.list(); }).then(function (items) { if (ticket === listing) showItems(n, items); }).catch(function (e) { if (ticket === listing) fail(n, e); });
        }

            var i = selected.indexOf(id), exists = available.some(function (x) { return x.id === id; });

            if (enabled && i < 0) { if (selected.length >= MAX_INPUTS) { view.status('一次最多选择 16 份材料。', true); return; } selected.push(id); }
            if (!enabled && i >= 0) selected.splice(i, 1);

        }
        function confirm() {
            if (!candidate || busy || !alive) return;
            var text = candidate.text; cancel(); saved = null; view.replace(text); view.status('已完整读入，可编辑后送回工作台。', false);
        }
        function edit() { saved = null; offered = []; if (!busy) cancel(); view.saved(false); }
        function put() {
            if (busy || !alive) return Promise.resolve();
            var n = start(), text = view.text();
            setBusy(true, false); view.status('正在保存到工作台…', false);

                check(n); utf8Size(text, MAX_BYTES);

(function () {
    'use strict';
    function $(id) { return document.getElementById(id); }
    function node(tag, text, className) { var e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (className) e.className = className; return e; }
    function button(text, fn, className) { var e = node('button', text, className); e.type = 'button'; e.onclick = fn; return e; }
    var controller, pickerBody = null, listBox = null, selectedBox = null, readButton = null, page = 0, items = [], chosen = [], sent = false;
    function status(text, failed) { $('status').textContent = text; $('status').className = failed ? 'error' : ''; if (failed && $('sheet').open) { $('sheetError').textContent = text; $('sheetError').hidden = false; } }
    function hide() { if ($('sheet').open) $('sheet').close(); pickerBody = null; }
    function sheet(title) { hide(); $('sheetTitle').textContent = title; $('sheetError').hidden = true; $('sheetBody').textContent = ''; $('sheet').showModal(); return $('sheetBody'); }
    function shortName(name) { name = String(name || '未命名材料'); return name.length > 80 ? name.slice(0, 80) + '…' : name; }
    function paintPicker() {
        var focusId = document.activeElement && document.activeElement.getAttribute('data-material'), restore = null;
        listBox.textContent = ''; selectedBox.textContent = '';

        items.slice(page * 20, (page + 1) * 20).forEach(function (item) {
            var label = node('label', undefined, 'choice'), check = node('input'), order = chosen.indexOf(item.id);
            check.type = 'checkbox'; check.checked = order >= 0; check.onchange = function () { controller.toggle(item.id, check.checked); };
            check.setAttribute('data-material', item.id); if (focusId === item.id) restore = check;
            label.appendChild(check); label.appendChild(node('span', (order >= 0 ? (order + 1) + '. ' : '') + shortName(item.name))); listBox.appendChild(label);
        });
        if (!items.length) listBox.appendChild(node('p', '工作台里没有可选的文本或文件。', 'detail'));
        selectedBox.appendChild(node('p', '已选 ' + chosen.length + ' 份 · 按勾选顺序拼接', 'detail'));
        var nav = node('div', undefined, 'actions'), prev = button('上一组', function () { page -= 1; paintPicker(); }), next = button('下一组', function () { page += 1; paintPicker(); });
        prev.disabled = page === 0; next.disabled = (page + 1) * 20 >= items.length; nav.appendChild(prev); nav.appendChild(next); selectedBox.appendChild(nav); readButton.disabled = !chosen.length;

            items = list; chosen = selection; paintPicker();

        preview:function (value) {

            body.appendChild(button('替换当前文本', function () { controller.confirm(); }, 'primary'));
        },
        targets:function (list) {

}());

</script></body></html>
